<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manager Login - Warehouse System</title>
        <link rel="stylesheet" href="style.css">


<Style>
.page-nav  
        {
        position: 0;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 20px;
        font-family: sans-serif;
        }

.page-nav a
        {
        text-decoration: none;
        font-weight: bold;
        color: #1e293b;
        padding: 6px 10px;
        border-radius: 4px;
}

.page-nav a:hover 
        {
        background-color: #e2e8f0;
        color: #000000;
        }

</style>
        
</head>
<body>
<div class="app-container" style="max-width: 420px; margin: 4rem auto;">
<header>

        <h1>Warehouse Management</h1>

       <nav class="page-nav" aria-label="Main navigation">
    <a href="/">Home</a>
    <a href="/sales interface.html">Sales</a>
    <a href="/Manager%20interface-1.html">Manager</a>
</nav>

<div id="alert-banner" class="alert-banner hidden" role="status"></div>
</header>

<div class="card">
        <h3>Manager Login</h3>
        <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" required placeholder="admin">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
        <button type="submit" class="btn-primary">Sign In</button>
</form>
</div>
</div>

<script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
        });

        if (response.ok) {
        window.location.href = "/Manager%20interface-1.html";
        } else 
        {
        const banner = document.getElementById("alert-banner");
        banner.innerText = "You have entered an invalid username or password.";
        banner.classList.remove("hidden");
        }
        });
</script>
</body>
</html>
