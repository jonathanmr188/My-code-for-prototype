<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Inventory Management</title>
    <link rel="stylesheet" href="style.css">

</head>
    <div class="app-container">
        <header>
            <h1>Warehouse Sales System</h1>
            <div id="alert-banner" class="alert-banner hidden"></div>
        </header>

    <body>
            <main class="dashboard-grid">
            <section class="control-panel">

    <div class="card">
            <h3>Record Sale</h3>
                    <form id="sale-form">
                        <label for="sale-item-id">Item ID</label>
                        <input type="number" id="sale-item-id" required placeholder="e.g., 2">

                        <label for="sale-qty">Quantity Sold</label>
                        <input type="number" id="sale-qty" required min="1" placeholder="Number of units sold">

                        <button type="submit" class="btn-primary sale-btn">Log Sale</button>
                    </form>
                </div>

                 <div class="card metrics-card">
                    <h3>📊 System Metrics</h3>
                    <div class="metric">
                        <span>Total Stock Volume:</span>
                        <strong id="total-volume">0</strong>
                    </div>


                <div class="actions">
                        <button id="btn-report" class="btn-secondary">Run Low Stock Report</button>
                        <button id="btn-save" class="btn-secondary">Save System State</button>
                    </div>
                </div>

                            <section class="display-panel">
                <div class="card">
                    <h3>📋 Current Inventory Stock</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Product Name</th>
                                    <th>Quantity</th>
                                    <th>Price (ZAR)</th>
                                    <th>Supplier</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card">
                    <h3>📈 Sales Tracker</h3>
                    <ul id="sales-list" class="sales-list"></ul>
                </div>
            </section>
        </main>
    </div>
</body>
</html>

    </section>
    </main>
    </body>
</html>
